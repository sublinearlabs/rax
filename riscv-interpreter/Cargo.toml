[package]
name = "riscv-interpreter"
version.workspace = true
edition.workspace = true

[features]
default = ["gc"]
ext_i = []
ext_m = []
ext_a = []
ext_f = []
ext_d = []
ext_c = []
imac = ["ext_i", "ext_m", "ext_a", "ext_c"]
gc = ["imac", "ext_f", "ext_d"]

[dependencies]
riscv-core = { path = "../riscv-core" }
elf = "0.8.0"
hex = "0.4.3"
fxhash = "0.2.1"
