[package]
name = "riscv"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true
lto = "fat"
panic = "abort"

[features]
default = []
trace = []
# Enables binary logging of memory read/write operations to a file.
# Intended for performance analysis.
mem_trace_io = []


[dependencies]
elf = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vm_benchmark"
harness = false
