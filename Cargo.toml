[package]
name = "riscv"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true
lto = "fat"
panic = "abort"

[features]
default = ["gc"]
trace = []
jit = [
    "cranelift-codegen",
    "cranelift-jit",
    "cranelift-module",
    "cranelift-native",
    "cranelift-frontend",
]
ext_i = []
ext_m = []
ext_a = []
ext_f = []
ext_d = []
ext_c = []
imac = ["ext_i", "ext_m", "ext_a", "ext_c"]
gc = ["imac", "ext_f", "ext_d"]

[dependencies]
elf = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4.3"
fxhash = "0.2.1"
cranelift-codegen = { version = "0.104", optional = true }
cranelift-jit = { version = "0.104", optional = true }
cranelift-module = { version = "0.104", optional = true }
cranelift-native = { version = "0.104", optional = true }
cranelift-frontend = { version = "0.104", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "vm_benchmark"
harness = false

[[example]]
name = "fib_ima"
required-features = ["ext_i", "ext_m", "ext_a"]

[[example]]
name = "exec_block_ima"
required-features = ["ext_i", "ext_m", "ext_a"]

[[example]]
name = "echo_ima"
required-features = ["ext_i", "ext_m", "ext_a"]

[[example]]
name = "fib_imac"
required-features = ["imac"]

[[example]]
name = "exec_block_imac"
required-features = ["imac"]

[[example]]
name = "echo_imac"
required-features = ["imac"]

[[example]]
name = "fib_gc"
required-features = ["gc"]

[[example]]
name = "exec_block_gc"
required-features = ["gc"]

[[example]]
name = "echo_gc"
required-features = ["gc"]

[[test]]
name = "block_exec_elf"
required-features = ["gc"]

[[test]]
name = "echo_elf"
required-features = ["gc"]

[[test]]
name = "fib_elf"
required-features = ["gc"]
