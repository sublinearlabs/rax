[package]
name = "riscv-aot"
version.workspace = true
edition.workspace = true

[features]
default = ["ima"]
ext_i = []
ext_m = []
ext_a = []
ext_f = []
ext_d = []
ext_c = []
ima = ["ext_i", "ext_m", "ext_a"]
imac = ["ima", "ext_c"]
gc = ["imac", "ext_f", "ext_d"]

[dependencies]
riscv-core = { path = "../riscv-core" }
riscv-elfgen = { path = "../riscv-elfgen" }
dynasmrt = "5.0.0"
iced-x86 = "1.21.0"

[dev-dependencies]
hex = "0.4.3"
