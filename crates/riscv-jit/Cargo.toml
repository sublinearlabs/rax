[package]
name = "riscv-jit"
version.workspace = true
edition.workspace = true

[features]
default = ["gc"]
ext_i = ["riscv/ext_i"]
ext_m = ["riscv/ext_m"]
ext_a = ["riscv/ext_a"]
ext_f = ["riscv/ext_f"]
ext_d = ["riscv/ext_d"]
ext_c = ["riscv/ext_c"]
imac = ["ext_i", "ext_m", "ext_a", "ext_c"]
gc = ["imac", "ext_f", "ext_d"]

[dependencies]
riscv = { path = "../..", default-features = false }
cranelift-codegen = "0.129.1"
cranelift-jit = "0.129.1"
cranelift-module = "0.129.1"
cranelift-native = "0.129.1"
cranelift-frontend = "0.129.1"
